global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: heart-risk-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["heart-risk-api-pods.default.svc.cluster.local"]
        type: A
        port: 8000
